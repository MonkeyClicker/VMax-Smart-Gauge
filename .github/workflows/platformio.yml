name: PlatformIO Firmware

on:
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/platformio.yml"
  push:
    branches:
      - main
    paths:
      - "firmware/**"
      - ".github/workflows/platformio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-tests:
    name: Scanner regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run host parser and diagnostics tests
        run: bash firmware/test/host/run.sh

  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - simulated-gauge
          - nmea-scanner

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build firmware
        working-directory: firmware
        run: pio run -e "${{ matrix.environment }}"

      - name: Upload firmware binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            firmware/.pio/build/${{ matrix.environment }}/firmware.bin
            firmware/.pio/build/${{ matrix.environment }}/bootloader.bin
            firmware/.pio/build/${{ matrix.environment }}/partitions.bin
          if-no-files-found: error
          retention-days: 14
