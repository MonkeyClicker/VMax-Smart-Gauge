[platformio]
default_envs = simulated-gauge

[env]
; ESP32_Display_Panel requires Arduino-ESP32 3.1.x. Espressif's official
; PlatformIO example currently uses this pioarduino platform bridge.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3

; Receive-only scanner with live blue activity display.
[env:nmea-scanner]
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    ${env:simulated-gauge.build_flags}
lib_deps = ${env:simulated-gauge.lib_deps}
build_src_filter =
    +<main.cpp>
    -<simulated_gauge/>
    +<simulated_gauge/LvglPort.cpp>
    +<scanner/>

; Home/bench target: draws the first gauge screen with generated engine data.
[env:simulated-gauge]
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter =
    -<main.cpp>
    -<scanner/>
    +<simulated_gauge/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Select the board for every library compilation, independent of header discovery.
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_5
    -DLV_CONF_SKIP=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_48=1
    -DLV_SPRINTF_USE_FLOAT=1
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.0
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/lvgl/lvgl.git#v8.4.0
