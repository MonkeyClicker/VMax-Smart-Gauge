[platformio]
default_envs = simulated-gauge

[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; The original NMEA scanner remains firmware/src/main.cpp, unchanged.
[env:nmea-scanner]
build_src_filter =
    +<main.cpp>
    -<simulated_gauge/>

; Home/bench target: draws the first gauge screen with generated engine data.
[env:simulated-gauge]
build_src_filter =
    -<main.cpp>
    +<simulated_gauge/>
build_flags =
    ${env.build_flags}
    -DLV_CONF_SKIP=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_48=1
    -DLV_SPRINTF_USE_FLOAT=1
lib_deps =
    esp32_display_panel@1.0.0
    lvgl/lvgl@8.3.11
