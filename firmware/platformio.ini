[env:waveshare-esp32-s3-touch-lcd-5]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Waveshare board uses ESP32-S3-WROOM-1-N16R8: 16 MB flash / 8 MB OPI PSRAM.
; This generic S3 board profile is intentionally overridden until a dedicated
; Waveshare PlatformIO board definition is added to this repository.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Milestone 1 deliberately uses ESP32 TWAI directly so we can prove the
; physical NMEA 2000 connection before adding a higher-level NMEA library.
