<rect x="50" y="65.6" width="110" height="66.8" rx="1" fill="none" stroke="#bbb" stroke-width="0.3" stroke-dasharray="2 2"/>
<g font-family="sans-serif" text-anchor="middle"><text x="105" y="88" font-size="5">DASH CUTOUT</text><text x="105" y="99" font-size="5">174 × 139 mm</text><text x="105" y="109" font-size="4">Corner radius 6.5 mm</text><text x="105" y="145" font-size="3">Solid black line = cutout; outer dashed line = bezel</text>
